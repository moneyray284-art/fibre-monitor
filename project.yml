name: FibreMonitor
options:
  bundleIdPrefix: dev.mattdev0
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false
    CURRENT_PROJECT_VERSION: 10
    MARKETING_VERSION: "2.3.2"

targets:
  FibreMonitor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FibreMonitor
        excludes:
          - Resources/Outfit-Variable.ttf
    resources:
      - path: FibreMonitor/Resources/Outfit-Variable.ttf
    # No `info:` block: XcodeGen would regenerate Info.plist from defaults and drop
    # the launch screen key (the app then runs letterboxed) and the network settings.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mattdev0.fibremonitor
        INFOPLIST_FILE: FibreMonitor/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconOrange AppIconBlue AppIconPurple AppIconGreen AppIconLaunchArcs AppIconMonogramI AppIconArcsI AppIconLinkRing AppIconWavefrontW AppIconLaunchArcsCyan AppIconLaunchArcsSky AppIconLaunchArcsMint AppIconMonogramICyan AppIconMonogramISky AppIconMonogramIMint AppIconArcsICyan AppIconArcsISky AppIconArcsIMint AppIconLinkRingCyan AppIconLinkRingSky AppIconLinkRingMint AppIconWavefrontWCyan AppIconWavefrontWSky AppIconWavefrontWMint"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  FibreMonitorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FibreMonitorTests
    dependencies:
      - target: FibreMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mattdev0.fibremonitor.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FibreMonitor:
    build:
      targets:
        FibreMonitor: all
    test:
      targets:
        - FibreMonitorTests
