name: Build iOS IPA

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Native iOS App
    runs-on: macos-26-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          # Liquid Glass needs the iOS 26 SDK, i.e. Xcode 26 or newer.
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26+ on this runner"; ls /Applications | grep -i xcode; exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate LinkWave app icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render app icon asset sets
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python tools/generate_linkwave_icons.py

      - name: Generate Xcode Project
        working-directory: .
        run: |
          xcodegen generate

      - name: Run Unit Tests
        run: |
          DEST=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "Using Simulator ID: $DEST"
          xcodebuild test \
            -project FibreMonitor.xcodeproj \
            -scheme FibreMonitor \
            -destination "id=$DEST" \
            -derivedDataPath build_test

      - name: Build Application for Device
        run: |
          xcodebuild -project FibreMonitor.xcodeproj \
            -scheme FibreMonitor \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            clean build

      - name: Verify Info.plist
        run: |
          # Without a launch screen key iOS runs the app letterboxed (legacy mode).
          PLIST=build/Build/Products/Release-iphoneos/FibreMonitor.app/Info.plist
          for key in UILaunchScreen NSLocalNetworkUsageDescription NSAppTransportSecurity; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" > /dev/null || { echo "::error::$key missing from built Info.plist"; exit 1; }
          done
          for icon in AppIconOrange AppIconBlue AppIconPurple AppIconGreen; do
            /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons:$icon" "$PLIST" > /dev/null || { echo "::error::Alternate icon $icon missing from built Info.plist"; exit 1; }
          done
          APP=build/Build/Products/Release-iphoneos/FibreMonitor.app
          EXT="$APP/PlugIns/LinkWaveWidget.appex"
          test -f "$APP/FibreMonitor" || { echo "::error::Release app executable is missing"; exit 1; }
          test -d "$EXT" || { echo "::error::LinkWaveWidget.appex was not embedded in the app"; exit 1; }
          test -f "$EXT/LinkWaveWidget" || { echo "::error::Release widget executable is missing"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist" | grep -q 'com.apple.widgetkit-extension' || { echo "::error::WidgetKit extension point is missing"; exit 1; }
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected a numeric stable marketing version, found $VERSION"; exit 1; }
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::Expected a numeric build number, found $BUILD"; exit 1; }
          echo "LINKWAVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LINKWAVE_IPA_NAME=LinkWave-v$VERSION.ipa" >> "$GITHUB_ENV"
          echo "Version: $VERSION ($BUILD)"

      - name: Preserve App Group entitlements for sideload signing
        run: |
          APP=build/Build/Products/Release-iphoneos/FibreMonitor.app
          EXT="$APP/PlugIns/LinkWaveWidget.appex"
          APP_GROUP="group.dev.mattdev0.fibremonitor"

          # The IPA is installed by a sideload signer, so ad-hoc sign the nested
          # widget first and the containing app second. This records each target's
          # declared entitlements in its code signature for the installer to apply.
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements LinkWaveWidget/LinkWaveWidget.entitlements "$EXT"
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements FibreMonitor/Resources/FibreMonitor.entitlements "$APP"

          codesign -d --entitlements :- "$APP" > /tmp/linkwave-app-entitlements.plist 2>/dev/null
          codesign -d --entitlements :- "$EXT" > /tmp/linkwave-widget-entitlements.plist 2>/dev/null
          for ENTITLEMENTS in /tmp/linkwave-app-entitlements.plist /tmp/linkwave-widget-entitlements.plist; do
            ACTUAL_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$ENTITLEMENTS")
            [[ "$ACTUAL_GROUP" == "$APP_GROUP" ]] || {
              echo "::error::Expected App Group $APP_GROUP in $ENTITLEMENTS, found $ACTUAL_GROUP"
              exit 1
            }
          done
          echo "Verified matching App Group entitlement on LinkWave and LinkWaveWidget."

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/FibreMonitor.app build/Payload/LinkWave.app
          test -f build/Payload/LinkWave.app/PlugIns/LinkWaveWidget.appex/LinkWaveWidget || { echo "::error::Release widget was not packaged inside Payload"; exit 1; }
          cd build
          zip -r -q "$LINKWAVE_IPA_NAME" Payload
          echo "LINKWAVE_IPA_PATH=build/$LINKWAVE_IPA_NAME" >> "$GITHUB_ENV"
          echo "IPA Size:"
          ls -lh "$LINKWAVE_IPA_NAME"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkWave-${{ env.LINKWAVE_VERSION }}-IPA
          path: ${{ env.LINKWAVE_IPA_PATH }}
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${LINKWAVE_VERSION}"
          gh release create "$TAG" "$LINKWAVE_IPA_PATH" \
            --target "$GITHUB_SHA" \
            --title "LinkWave $TAG" \
            --notes "Unsigned build for Huawei OptiXstar HG8145X6 fibre routers. Install with Sideloadly, AltStore or SideStore." \
            --draft=false \
            --prerelease=false
